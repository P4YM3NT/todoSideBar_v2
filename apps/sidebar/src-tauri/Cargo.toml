[package]
name = "todosidebar"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "todosidebar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
todo-core = { path = "../../../crates/todo-core" }

chrono.workspace = true
serde.workspace = true
serde_json.workspace = true

tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"

[target.'cfg(target_os = "macos")'.dependencies]
# Community-Plugin ohne crates.io-Release. Auf den Commit gepinnt, nicht auf den
# Branch, damit ein Force-Push den Build nicht unter uns verändert.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.3"
