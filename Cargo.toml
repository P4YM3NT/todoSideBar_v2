[workspace]
resolver = "3"
members = ["crates/todo-core", "apps/sidebar/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.26.0", features = ["v7", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
